Header:
  Type: ITEM_DB
  Version: 3

# Overrides vanilla Elemental Converters (12114-12117) for Master
# Nokzin/Assistant Denrik in npc/endower.txt: applies the same
# SC_FIREWEAPON/WATERWEAPON/WINDWEAPON/EARTHWEAPON statuses Master
# Nokzin's own endow uses, for 30 minutes instead of the vanilla
# 3, and an explicit delitem as a backup to make sure the scroll
# is consumed on use.
# How to customize: change the sc_start duration (currently 1800000)
# to adjust how long the scroll's endow lasts.

Body:
  - Id: 12114
    AegisName: Elemental_Fire
    Type: Delayconsume
    Script: |
      sc_start SC_FIREWEAPON,1800000,5;
      delitem 12114,1;
  - Id: 12115
    AegisName: Elemental_Water
    Type: Delayconsume
    Script: |
      sc_start SC_WATERWEAPON,1800000,5;
      delitem 12115,1;
  - Id: 12116
    AegisName: Elemental_Earth
    Type: Delayconsume
    Script: |
      sc_start SC_EARTHWEAPON,1800000,5;
      delitem 12116,1;
  - Id: 12117
    AegisName: Elemental_Wind
    Type: Delayconsume
    Script: |
      sc_start SC_WINDWEAPON,1800000,5;
      delitem 12117,1;
